name: mass_ledger
description: "A new Flutter project."
# The following line prevents the package from accidentally being published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number.
# In Android, build-name is used as versionName while build-number is used as versionCode.
# Read more about versioning at:
# https://developer.android.com/studio/publish/versioning
version: 1.0.0+1

environment:
  sdk: ^3.11.1

# Dependencies specify other packages that your application needs to work.
# To automatically upgrade your package dependencies to the latest versions
# available on pub.dev, run `flutter pub upgrade --major-versions`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Calendar support
  table_calendar: ^3.2.0

  # Local storage
  shared_preferences: ^2.5.3

  # Supabase
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints
  # to encourage good coding practices. The lint set provided by the package
  # is activated in the analysis_options.yaml file located at the root
  # of your package.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the following page:
# https://dart.dev/tools/pubspec
#
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with the application, so that you can use the icons in
  # the Material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section here:
  # assets:
  #   - images/a_dot_burr.jpeg

  # An asset can refer to one or more resolution-specific "variants".
  # See:
  # https://flutter.dev/to/resolution-aware-image-assets

  # For more information about adding assets to your package, see:
  # https://docs.flutter.dev/development/ui/assets-and-images

  # To add custom fonts to your application, add a fonts section here.
  #
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #
  # For more information about fonts, see:
  # https://docs.flutter.dev/cookbook/design/fonts